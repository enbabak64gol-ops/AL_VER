<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AL_VER | مدیریت</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f6f7fb;color:#111827}.wrap{max-width:1150px;margin:auto;padding:18px}.bar{background:#0b1020;color:#fff;padding:13px 18px;display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.gold{background:#c8a96b;color:#111}.red{background:#b42318;color:#fff}.green{background:#067647;color:#fff}.outline{background:#fff;border:1px solid #d7dce5}.input,select,textarea{width:100%;padding:10px;border:1px solid #dfe3ea;border-radius:9px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #e3e7ee;border-radius:14px;padding:14px;background:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs{display:flex;gap:7px;flex-wrap:wrap}.status{padding:8px;border-radius:8px;background:#f2f4f7;font-size:12px}.hide{display:none}.media{display:flex;gap:6px;overflow:auto}.media img{width:75px;height:55px;object-fit:cover;border-radius:7px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="bar"><b>AL_VER | پنل مدیریت</b><span id="who">مهمان</span></div><main class="wrap"><section id="login" class="panel"><h2>ورود مدیریت</h2><p>ورود این پنل با ایمیل و رمز عبور PocketBase انجام می‌شود و وابسته به SMS نیست.</p><input id="email" class="input" type="email" placeholder="ایمیل"><br><br><input id="password" class="input" type="password" placeholder="رمز عبور"><br><br><button class="btn primary" onclick="login()">ورود</button><p id="msg" class="status"></p><p class="status">برای اولین مدیر، یک حساب users بسازید و role آن را در داشبورد PocketBase روی <b>main</b> بگذارید. سپس از اینجا مدیریت کامل را انجام دهید.</p></section><section id="app" class="hide"><div class="panel"><div class="tabs"><button class="btn gold" onclick="showTab('pending')">در انتظار</button><button class="btn outline" onclick="showTab('all')">همه آگهی‌ها</button><button class="btn outline" onclick="showTab('admins')">مدیران</button><button class="btn outline" onclick="logout()">خروج</button></div></div><div id="content"></div></section></main><script src="https://unpkg.com/pocketbase@0.26.2/dist/pocketbase.umd.js"></script><script>
const pb=new PocketBase(location.origin);const $=id=>document.getElementById(id);let role='',tab='pending';
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function fileUrl(r,n){return r[n]?pb.files.getURL(r,r[n]):''}
async function login(){try{await pb.collection('users').authWithPassword($('email').value.trim(),$('password').value);role=pb.authStore.record.role||'user';if(!['main','admin'].includes(role)){pb.authStore.clear();throw Error('این حساب دسترسی مدیریتی ندارد.')}$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=(role==='main'?'مدیر اصلی':'ادمین')+' · '+pb.authStore.record.email;showTab('pending')}catch(e){$('msg').textContent=e.message||'ورود ناموفق بود'}}
function logout(){pb.authStore.clear();location.reload()}
async function showTab(t){tab=t;const c=$('content');c.innerHTML='<div class="panel">در حال بارگذاری...</div>';if(t==='admins'){if(role!=='main'){c.innerHTML='<div class="panel">فقط مدیر اصلی می‌تواند مدیران را مدیریت کند.</div>';return}const users=await pb.collection('users').getFullList({sort:'email'});c.innerHTML='<div class="panel"><h2>مدیریت مدیران</h2><p class="status">برای افزودن مدیر، کاربر ابتدا باید در سایت ثبت‌نام کرده باشد. سپس نقش او را از همین صفحه به admin تغییر دهید.</p></div><div class="grid">'+users.map(u=>`<article class="card"><b>${esc(u.email)}</b><p>${esc(u.displayName||'')}</p><div class="status">نقش فعلی: ${esc(u.role)}</div><div class="row">${u.role!=='admin'?`<button class="btn green" onclick="setRole('${u.id}','admin')">ادمین کردن</button>`:''}${u.role==='admin'?`<button class="btn gold" onclick="setRole('${u.id}','user')">لغو ادمینی</button>`:''}${u.role!=='main'?`<button class="btn red" onclick="removeUser('${u.id}')">حذف حساب</button>`:''}</div></article>`).join('')+'</div>';return}const filter=t==='pending'?'status="pending"':'';const rows=await pb.collection('listings').getFullList({filter,sort:'-created'});c.innerHTML=rows.length?'<div class="grid">'+rows.map(card).join('')+'</div>':'<div class="panel">موردی وجود ندارد.</div>'}
function card(x){const photos=(x.photos||[]).map(n=>`<img src="${fileUrl(x,n)}">`).join('');return `<article class="card"><h3>${esc(x.title)}</h3><div class="status">${esc(x.type)} · ${esc(x.deal)} · وضعیت: ${esc(x.status)}</div><p>📍 ${esc(x.city)}<br>💰 ${Number(x.price||0).toLocaleString('fa-IR')} تومان<br>${esc(x.model||'')}</p>${photos?`<div class="media">${photos}</div>`:''}<p>${esc(x.description||'')}</p>${x.status==='pending'?`<input id="phone-${x.id}" class="input" placeholder="شماره تماس برای انتشار"><br><br><div class="row"><button class="btn green" onclick="approve('${x.id}')">تأیید و انتشار</button><button class="btn outline" onclick="reject('${x.id}')">رد</button></div>`:''}${role==='main'?`<br><button class="btn red" onclick="del('${x.id}')">حذف دائمی</button>`:''}</article>`}
async function approve(id){const phone=$(('phone-'+id)).value.trim();await pb.collection('listings').update(id,{status:'approved',publicPhone:phone});showTab(tab)}async function reject(id){const reason=prompt('دلیل رد آگهی:')||'نیاز به اصلاح اطلاعات';await pb.collection('listings').update(id,{status:'rejected',rejectReason:reason});showTab(tab)}async function del(id){if(role!=='main'||!confirm('حذف دائمی این آگهی؟'))return;await pb.collection('listings').delete(id);showTab(tab)}async function setRole(id,r){await pb.collection('users').update(id,{role:r});showTab('admins')}async function removeUser(id){if(!confirm('حذف دائمی حساب کاربری؟'))return;await pb.collection('users').delete(id);showTab('admins')}
</script></body></html>
